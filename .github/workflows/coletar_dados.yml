name: Coletar Dados Dashboard Marketing

on:
  schedule:
    - cron: '30 10 * * *'  # 07:30 BRT (UTC-3)
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Criar arquivo .env
        run: |
          cat > .env << 'EOF'
          RD_CLIENT_ID=${{ secrets.RD_CLIENT_ID }}
          RD_CLIENT_SECRET=${{ secrets.RD_CLIENT_SECRET }}
          RD_REFRESH_TOKEN=${{ secrets.RD_REFRESH_TOKEN }}
          RD_CRM_TOKEN=${{ secrets.RD_CRM_TOKEN }}
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          EOF

      - name: Criar credenciais Google
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials/google_service_account.json
          echo '${{ secrets.GA4_TOKEN_JSON }}' > credentials/ga4_token.json

      - name: Executar coleta de dados
        run: python main.py

      - name: Gerar dados do dashboard
        run: |
          mkdir -p dashboard/data
          python scripts/generate_dashboard_data.py

      - name: Publicar dados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/summary.json
          git diff --cached --quiet || git commit -m "chore: atualiza dados do dashboard [$(date +'%d/%m/%Y %H:%M')]"
          git push

      - name: Verificar rotacao do refresh token
        if: always()
        run: |
          NEW_TOKEN=$(grep "RD_REFRESH_TOKEN=" .env | cut -d'=' -f2 | tr -d ' ')
          CURRENT_TOKEN="${{ secrets.RD_REFRESH_TOKEN }}"
          if [ "$NEW_TOKEN" != "$CURRENT_TOKEN" ] && [ -n "$NEW_TOKEN" ]; then
            echo "::warning::Refresh token foi rotacionado. Atualize o secret RD_REFRESH_TOKEN para: $NEW_TOKEN"
          fi

name: Coletar Dados Dashboard Marketing

on:
  schedule:
    - cron: '30 10 * * *'  # 07:30 BRT (UTC-3)
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Criar arquivo .env
        run: |
          cat > .env << 'EOF'
          RD_CLIENT_ID=${{ secrets.RD_CLIENT_ID }}
          RD_CLIENT_SECRET=${{ secrets.RD_CLIENT_SECRET }}
          RD_REFRESH_TOKEN=${{ secrets.RD_REFRESH_TOKEN }}
          RD_CRM_TOKEN=${{ secrets.RD_CRM_TOKEN }}
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN=${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID=${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET=${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN=${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID=${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          DASHBOARD_PASSWORD=${{ secrets.DASHBOARD_PASSWORD }}
          EOF

      - name: Validar DASHBOARD_PASSWORD
        run: |
          if [ -z "${{ secrets.DASHBOARD_PASSWORD }}" ]; then
            echo "::error::Secret DASHBOARD_PASSWORD nao configurado! Pipeline ABORTADO para nao expor dados em texto puro."
            exit 1
          fi
          echo "OK: DASHBOARD_PASSWORD definido (length=${#DASHBOARD_PASSWORD})"
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}

      - name: Criar credenciais Google
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials/google_service_account.json
          echo '${{ secrets.GA4_TOKEN_JSON }}' > credentials/ga4_token.json

      - name: Executar coleta de dados
        run: python main.py

      - name: Gerar dados do dashboard
        run: |
          mkdir -p dashboard/data
          python scripts/generate_dashboard_data.py

      - name: Publicar dados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/summary.json
          git diff --cached --quiet || git commit -m "chore: atualiza dados do dashboard [$(date +'%d/%m/%Y %H:%M')]"
          git push

      - name: Publicar dashboard no GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy para GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Verificar rotacao do refresh token
        if: always()
        run: |
          NEW_TOKEN=$(grep "RD_REFRESH_TOKEN=" .env | cut -d'=' -f2 | tr -d ' ')
          CURRENT_TOKEN="${{ secrets.RD_REFRESH_TOKEN }}"
          if [ "$NEW_TOKEN" != "$CURRENT_TOKEN" ] && [ -n "$NEW_TOKEN" ]; then
            echo "::warning::Refresh token foi rotacionado. Atualize o secret RD_REFRESH_TOKEN para: $NEW_TOKEN"
          fi
